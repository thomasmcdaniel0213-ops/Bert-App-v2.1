<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d66">
<meta name="application-name" content="Bert v2.1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bert v2.1">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>Bert v2.1</title>
<style>
:root{
  --sky:#11a9e2;--navy:#0b3d66;--navy2:#082d4d;--lime:#ddff35;--cream:#fffaf0;
  --ink:#112a3b;--muted:#587184;--line:#cde3ee;--panel:#ffffff;--soft:#e8f7fd;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{
  background:
    radial-gradient(circle at 20% 0%, rgba(221,255,53,.20), transparent 28%),
    linear-gradient(180deg,#dff6ff 0%,#f8fcfe 55%,#eef8fd 100%);
}
header{
  background:linear-gradient(90deg,var(--navy2),var(--navy),var(--sky));
  color:white;border-bottom:1px solid rgba(255,255,255,.25);
  padding:12px 16px;
}
.topbar{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;border-radius:11px}
.brand h1{font-size:19px;margin:0}.brand .sub{font-size:12px;color:#dff4ff;margin-top:2px}
.version{background:var(--lime);color:#274900;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800}
main{max-width:1180px;margin:auto;padding:18px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:24px;align-items:center;min-height:520px}
.logo-wrap{
  min-height:470px;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 48%,rgba(17,169,226,.16),transparent 40%),
    linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.48));
  border:1px solid var(--line);border-radius:28px;padding:18px;
  box-shadow:0 12px 32px rgba(11,61,102,.10);
}
.logo-wrap img{
  width:min(620px,88vw);max-height:560px;object-fit:contain;display:block;
}
.menu h2{font-size:34px;line-height:1.05;margin:0;color:var(--navy)}
.menu .lead{color:var(--muted);font-size:15px;line-height:1.5;margin:10px 0 18px}
.feature-grid{display:grid;grid-template-columns:1fr;gap:12px}
.feature{
  border:0;border-radius:18px;padding:18px 20px;text-align:left;cursor:pointer;
  min-height:110px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 8px 20px rgba(11,61,102,.08);transition:.15s ease;
}
.feature:hover{transform:translateY(-1px)}
.feature strong{font-size:22px;display:block}
.feature small{font-size:13px;display:block;margin-top:5px;line-height:1.35}
.feature .arrow{font-size:28px;font-weight:800}
.tournament{background:linear-gradient(135deg,var(--navy),#145a8c);color:#fff}
.roundrobin{background:linear-gradient(135deg,var(--sky),#39c3ef);color:#062c3c}
.coming{background:rgba(255,255,255,.78);border:1px solid var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none}
.coming strong{color:var(--navy)}
.badge{display:inline-block;background:var(--lime);color:#2b4f00;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:800;margin-top:7px}
.footer-note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.45}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;min-height:auto}
  .logo-wrap{min-height:340px}
  .menu h2{font-size:28px}
}
@media(max-width:520px){
  main{padding:12px}
  .logo-wrap{min-height:300px;padding:10px;border-radius:20px}
  .feature{min-height:100px;padding:16px}
  .feature strong{font-size:20px}
}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <img src="bert-logo.png" alt="Bert logo">
      <div><h1>Bert</h1><div class="sub">Pickleball Event Manager</div></div>
    </div>
    <span class="version">v2.1 Test</span>
  </div>
</header>

<main>
  <section class="hero">
    <div class="logo-wrap">
      <img src="bert-logo.png" alt="Bert pickleball dog logo">
    </div>

    <div class="menu">
      <h2>What are we playing?</h2>
      <div class="lead">Choose a format and Bert will take you into the right event builder.</div>

      <div class="feature-grid">
        <button class="feature tournament" id="goTournament">
          <span>
            <strong>Tournament Builder</strong>
            <small>Pools, brackets, schedules, score entry, standings, Live Control & backups</small>
            <span class="badge">v2 BUILT</span>
          </span>
          <span class="arrow">›</span>
        </button>

        <button class="feature roundrobin" id="goRoundRobin">
          <span>
            <strong>Round Robin</strong>
            <small>Doubles, Singles or Mixed Doubles · Rotating or Fixed Partners</small>
            <span class="badge">v3 READY TO TEST</span>
          </span>
          <span class="arrow">›</span>
        </button>

        <button class="feature coming" disabled>
          <span><strong>Ladder League</strong><small>Ranked ladder scheduling and movement</small><span class="badge">COMING SOON</span></span>
          <span class="arrow">›</span>
        </button>

        <button class="feature coming" disabled>
          <span><strong>MiLP</strong><small>Team-based Major League Pickleball style format</small><span class="badge">COMING SOON</span></span>
          <span class="arrow">›</span>
        </button>
      </div>

      <div class="footer-note">
        Bert keeps each module separate so tournament-bracket planning remains the core product while Round Robin, Ladder League, and MiLP can grow independently.
      </div>
    </div>
  </section>
</main>

<script>
document.getElementById('goTournament').addEventListener('click',()=>location.href='tournament.html');
document.getElementById('goRoundRobin').addEventListener('click',()=>location.href='round-robin.html');
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
